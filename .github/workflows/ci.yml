# CI workflow for wxWidgets builds using configure+make under Unix.
name: Unix builds

on:
  push:
    branches:
      - master
      # Fork only, not for upstream: without this branch here none of
      # these workflows ever run on any of the port's commits.
      - claude/gtk4-wxwidgets-port-plan-pwo52u
    paths-ignore:
      - '.circleci/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/ci_mac.yml'
      - '.github/workflows/ci_cmake.yml'
      - '.github/workflows/ci_msw.yml'
      - '.github/workflows/ci_msw_cross.yml'
      - '.github/workflows/docs_update.yml'
      - 'build/cmake/**'
      - 'build/tools/appveyor*.bat'
      - 'distrib/**'
      - 'docs/**'
      - 'interface/**'
      - 'include/msvc/**'
      - 'include/wx/msw/**'
      - 'locale/**'
      - 'src/msw/**'
      - '*.md'
      - '*.yml'
      - 'CMakeLists.txt'
      - 'wxwidgets.props'
  pull_request:
    branches:
      - master
      # Fork only, not for upstream: without this branch here none of
      # these workflows ever run on any of the port's commits.
      - claude/gtk4-wxwidgets-port-plan-pwo52u
    paths-ignore:
      - '.circleci/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/ci_mac.yml'
      - '.github/workflows/ci_cmake.yml'
      - '.github/workflows/ci_msw.yml'
      - '.github/workflows/ci_msw_cross.yml'
      - '.github/workflows/docs_update.yml'
      - 'build/cmake/**'
      - 'build/tools/appveyor*.bat'
      - 'distrib/**'
      - 'docs/**'
      - 'interface/**'
      - 'include/msvc/**'
      - 'include/wx/msw/**'
      - 'locale/**'
      - 'src/msw/**'
      - '*.md'
      - '*.yml'
      - 'CMakeLists.txt'
      - 'wxwidgets.props'
  workflow_dispatch:
    inputs:
      debug_tests:
        type: boolean
        description: 'Enable ssh server before running the tests'
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}
    container:
      image: ${{ matrix.container }}
      # We need to make container privileged just to allow writing to
      # /proc/sys/kernel/core* files below.
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 wxGTK 2
            runner: ubuntu-26.04
            gtk_version: 2
            use_xvfb: true
          # The name is used as the ccache key, which GitHub rejects if it
          # contains a comma, so keep it free of punctuation. The port's
          # status is tracked in docs/gtk/gtk4-status.md.
          - name: Ubuntu 24.04 wxGTK 4 - WIP port
            runner: ubuntu-24.04
            gtk_version: 4
            # Input simulation is deliberately *not* disabled here, although
            # it was until #126. wxUIActionSimulator's X11 backend has had a
            # working GTK4 branch since progress update 39, and leaving the
            # flag on compiled out every test that synthesises input -- so the
            # job reported "all tests passed" while measuring a suite two dozen
            # cases smaller than the one the wxGTK 2 and 3 jobs run. The cases
            # it now runs included some that failed when this was written;
            # those were #82 and are fixed, so the suite is green here and the
            # job blocks like every other one. A job that measures less than it
            # appears to is worse than a job with known red tests in it.
            configure_flags: --enable-accessibility
            # Still true: the port emits deprecation warnings, tracked in #78.
            allow_warnings: true
            use_xvfb: true
            # The GUI library and all the samples build now, and test_gui runs
            # the whole suite, so this job no longer restricts itself to the
            # console tests -- it builds and tests what every other job does.
            #
            # It also blocks like every other job now. continue-on-error was
            # set here while nobody knew how the port behaved on a runner
            # rather than on a developer's machine, to be removed "once it has
            # been green for a while". It has: six consecutive green runs
            # across two days, both suites complete, since #126 stopped the job
            # compiling the input tests out and #82 fixed what that exposed.
            # Nothing protects a green that cannot fail.
          - name: Ubuntu 26.04 wxGTK UTF-8
            runner: ubuntu-26.04
            configure_flags: --enable-utf8 --enable-utf8only --enable-monolithic
            use_xvfb: true
          - name: Ubuntu 20.04 wxGTK gcc 7 static compatible 3.0
            runner: ubuntu-26.04
            container: ubuntu:20.04
            compiler: g++-7
            configure_flags: --enable-compat30 --enable-pch --disable-shared
            use_xvfb: true
          - name: Ubuntu 20.04 wxGTK 3 with clang
            runner: ubuntu-latest
            container: ubuntu:20.04
            compiler: clang++-10
            configure_flags: --disable-sys-libs
            extra_warnings: -Winconsistent-missing-override
            use_xvfb: true
          - name: Ubuntu 22.04 wxGTK with wx containers
            runner: ubuntu-22.04
            configure_flags: --enable-compat30 --disable-std_containers
            extra_warnings: -Wsuggest-override
            use_xvfb: true
            check_headers: true
          - name: Ubuntu 24.04 wxGTK ASAN not compatible
            runner: ubuntu-24.04
            configure_flags: --enable-std_string_conv_in_wxstring --disable-compat32 --disable-sys-libs
            extra_warnings: -Wsuggest-override
            skip_samples: true
            use_asan: true
            use_xvfb: true
          - name: Ubuntu 24.04 wxGTK UBSAN
            runner: ubuntu-24.04
            configure_flags: --with-lunasvg --with-cxx=20
            extra_warnings: -Wsuggest-override
            use_ubsan: true
            use_xvfb: true
            build_out_of_tree_samples: true
          - name: Ubuntu 26.04 wxX11
            runner: ubuntu-26.04
            configure_flags: --with-x11 --disable-stc
            skip_samples: true
          - name: Ubuntu 24.04 wxDFB
            # This is the latest Ubuntu version that still has DirectFB in its repositories.
            runner: ubuntu-24.04
            configure_flags: --with-directfb --disable-stc
            skip_samples: true
            allow_warnings: true
          - name: Ubuntu 26.04 wxQt
            runner: ubuntu-26.04
            configure_flags: --with-qt --without-opengl
            skip_samples: true
            use_xvfb: true

    env:
      wxGTK_VERSION: ${{ matrix.gtk_version && matrix.gtk_version || 3 }}
      wxCONFIGURE_FLAGS: ${{ matrix.configure_flags }}
      wxUSE_ASAN: ${{ matrix.use_asan && 1 || 0 }}
      wxUSE_XVFB: ${{ matrix.use_xvfb && 1 || 0 }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Set up build system
        run: |
          case '${{ matrix.container }}' in
            ubuntu:*)
              export DEBIAN_FRONTEND=noninteractive

              compiler=${{ matrix.compiler }}
              case "$compiler" in
                clang++*)
                  compiler_packages='clang libc++-dev libc++abi-dev'
                  ;;

                g++*)
                  compiler_packages="${compiler}"
                  ;;

                '')
                  # Assume gcc.
                  compiler_packages='g++'
                  ;;

                *)
                  echo '::error ::Unknown compiler kind.'
                  exit 1
              esac

              # Ubuntu servers sometimes fail because of transient network
              # issues, so retry apt-get commands a few times before giving up.
              retry_apt()
              {
                attempts=5
                delay=30
                attempt=1

                while ! "$@"; do
                  if [[ $attempt -ge $attempts ]]; then
                    return 1
                  fi

                  echo "Command failed, retrying in ${delay}s (attempt $((attempt + 1))/$attempts): $*"
                  attempt=$((attempt + 1))
                  sleep $delay
                done
              }
              retry_apt apt-get update -qq

              # Explanation for installing some less obvious packages:
              #   - coreutils contains nproc used in proc_count.sh called below.
              #   - xvfb is used for running the GUI tests.
              retry_apt apt-get install -qq coreutils ${compiler_packages} git make pkg-config sudo xvfb
              ;;

            '')
              ;;

            *)
              echo '::error ::Unknown container kind.'
              exit 1
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.name }}

      - name: Set up build environment
        run: |
          wxPROC_COUNT=`./build/tools/proc_count.sh`
          echo wxBUILD_ARGS=-j$wxPROC_COUNT >> $GITHUB_ENV

          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

          # Setting this variable suppresses "Error retrieving accessibility bus address"
          # messages from WebKit tests that we're not interested in.
          echo NO_AT_BRIDGE=1 >> $GITHUB_ENV

          compiler=${{ matrix.compiler }}
          case "$compiler" in
            clang++*)
              echo CC=`echo $compiler | sed s/++//` >> $GITHUB_ENV
              echo CXX="$compiler -stdlib=libc++" >> $GITHUB_ENV
              echo LD=$compiler >> $GITHUB_ENV

              allow_warn_opt="-Wno-error=#warnings"

              export WX_EXTRA_PACKAGES="libc++-dev"
              ;;

            g++*)
              echo CC=`echo $compiler | sed s/++/cc/` >> $GITHUB_ENV
              echo CXX=$compiler >> $GITHUB_ENV
              echo LD=$compiler >> $GITHUB_ENV
              allow_warn_opt="-Wno-error=cpp"
              ;;

            '')
              # Assume gcc.
              allow_warn_opt="-Wno-error=cpp"
              ;;

            *)
              echo "*** Unknown compiler: ${{ matrix.compiler }} ***"
              ;;
          esac

          if [ -z ${{ matrix.allow_warnings }} ]; then
            if [ -z ${{ matrix.allow_extra_warnings }} ]; then
              error_opts="-DwxENABLE_EXTRA_WARNINGS ${{ matrix.extra_warnings }}"
            fi
            error_opts="$error_opts -Werror $allow_warn_opt"
            echo "wxMAKEFILE_ERROR_CXXFLAGS=$error_opts" >> $GITHUB_ENV
            echo "wxMAKEFILE_CXXFLAGS=$wxMAKEFILE_CXXFLAGS $error_opts" >> $GITHUB_ENV
          fi

          echo "wxMAKEFILE_CXXFLAGS=$wxMAKEFILE_CXXFLAGS $error_opts" >> $GITHUB_ENV

          ./build/tools/before_install.sh

      - name: Show build environment
        run: |
          echo "Environment:"
          env | sort
          echo

          echo "Make version:"
          make --version
          echo

          echo "Compiler version:"
          ${CXX-g++} --version
          echo

          echo "ccache version:"
          ccache --version || echo "ccache not available"
          echo

          echo "Free space:"
          df -h /
          echo

      - name: Configuring
        run: |
          wxCONFIGURE_OPTIONS="--disable-optimise $wxCONFIGURE_FLAGS"
          if [ -n "${{ matrix.gtk_version }}" ]; then
            wxCONFIGURE_OPTIONS="--with-gtk=${{ matrix.gtk_version }} $wxCONFIGURE_OPTIONS"
          fi

          if [ ${{ matrix.use_asan }} ]; then
            wxSANITIZER_FLAGS='-fsanitize=address'

            echo 'ASAN_OPTIONS=fast_unwind_on_malloc=0' >> $GITHUB_ENV
          elif [ ${{ matrix.use_ubsan }} ]; then
            wxSANITIZER_FLAGS='-fsanitize=undefined'
          fi

          if [ -n "$wxSANITIZER_FLAGS" ]; then
            ./configure $wxCONFIGURE_OPTIONS --enable-debug \
                "CFLAGS=$wxSANITIZER_FLAGS -fno-omit-frame-pointer" \
                "CXXFLAGS=$wxSANITIZER_FLAGS -fno-omit-frame-pointer" \
                "LDFLAGS=$wxSANITIZER_FLAGS" || rc=$?
          else
            ./configure $wxCONFIGURE_OPTIONS --disable-debug_info || rc=$?
          fi

          if [ -n "$rc" ]; then
            echo '*** Configuring failed, contents of config.log follows: ***'
            echo '-----------------------------------------------------------'
            cat config.log
            echo '-----------------------------------------------------------'
            exit $rc
          fi

      - name: Checking GTK4 platform invariants
        if: matrix.gtk_version == 4
        run: |
          # Assumptions about GTK4's own behaviour that the port depends on:
          # widget tree shape, style resolution, widget ownership. A GTK
          # upgrade can change these silently -- the symptom is wrong metrics,
          # not a crash -- so check them explicitly. Needs only GTK, not libwx,
          # so it runs regardless of how far the port currently builds.
          # See docs/gtk/gtk4-stylecontext-design.md.
          # XTest is optional: it enables the gesture-semantics checks, which
          # need real injected clicks. Without it those are simply not built,
          # and without a usable display they report SKIP rather than failing.
          if pkg-config --exists xtst; then
            xtest_flags="-DHAVE_XTEST $(pkg-config --cflags --libs xtst) -lX11"
          else
            xtest_flags=""
            echo "note: XTest not available, gesture checks will be skipped"
          fi
          gcc -o /tmp/gtk4-invariants build/tools/gtk4-invariants.c \
              $(pkg-config --cflags --libs gtk4) $xtest_flags \
              -Wno-deprecated-declarations
          xvfb-run -a /tmp/gtk4-invariants

      - name: Checking GTK4 ownership annotations
        if: matrix.gtk_version == 4
        run: |
          # Whether a GTK function hands you a reference to release, or takes
          # one from you, is not in the headers -- only in the introspection
          # annotations. A function whose signature is unchanged can have
          # swapped sides between GTK3 and GTK4, and the symptom is a leak or a
          # double free much later, never a compile error. This compares the
          # two sets of annotations for every GTK function wxGTK calls and
          # fails on any difference that has not been reviewed.
          # Returns 77 and passes if the .gir files are not installed.
          python3 build/tools/gtk4-ownership-diff.py || \
            test $? -eq 77

      - name: Checking GTK4 property names
        if: matrix.gtk_version == 4
        run: |
          # GObject properties are addressed by string, so a renamed or removed
          # one is not a compile error: setting it does nothing and reading it
          # leaves the destination untouched. GtkSpinner's "active" became
          # "spinning" and GtkCalendar lost "no-month-change" this way.
          # Returns 77 and passes if the .gir files are not installed.
          python3 build/tools/gtk4-property-names.py || \
            test $? -eq 77

      - name: Checking GTK4 accessibility against GTK itself
        if: matrix.gtk_version == 4
        run: |
          # wxUSE_ACCESSIBILITY under GTK4 rests on three things GTK4 added in
          # 4.10, and on one GTK bug. None of them are visible at compile time:
          # a GTK upgrade that changed any of them would leave wxAccessible
          # quietly describing nothing, or describing it wrongly, with the
          # suite still green. These need only GTK, so they run before the
          # library is built. See docs/gtk/gtk4-accessibility.md.
          gcc -o /tmp/gtk4-a11y-virtual-child \
              docs/gtk/probes/gtk4-a11y-virtual-child.c \
              $(pkg-config --cflags --libs gtk4)
          GTK_A11Y=test xvfb-run -a /tmp/gtk4-a11y-virtual-child

          # And the clipboard: releasing the selection and claiming it again
          # in one turn of the main loop loses what was just put on it, which
          # is why wxClipboard::Clear() defers the release. If GTK ever fixes
          # that, the deferral becomes unnecessary rather than wrong, but the
          # other three orderings must stay reliable.
          gcc -o /tmp/gtk4-clipboard-reclaim \
              docs/gtk/probes/gtk4-clipboard-reclaim.c \
              $(pkg-config --cflags --libs gtk4)
          xvfb-run -a /tmp/gtk4-clipboard-reclaim

      - name: Building
        run: |
          if [ ${{ matrix.use_asan }} ]; then
            # This is a horrible hack needed to prevent ASAN from being used
            # for the WebKit extension shared library: this wouldn't work
            # because this library is loaded in a separate WebKit process not
            # using ASAN. This should really be fixed at makefile level, but
            # for now just work around the problem here by manually building
            # this library without ASAN: get the compile and link commands
            # (the only ones that should contain ASAN flags) and filter these
            # flags out from them before running them.
            /bin/sh -xc "`make -n install_webkit2_ext | sed -n -e 's/-fsanitize=address//gp'`"
          fi
          make -k $wxBUILD_ARGS "CXXFLAGS=$wxMAKEFILE_ERROR_CXXFLAGS"

      - name: Checking the wxAccessible bridge
        if: matrix.gtk_version == 4
        run: |
          # The end-to-end check: a wxAccessible's name, role, states, bounds
          # and child tree, and a real wxGrid's twelve cells and headers,
          # read back out of GTK. Unlike the two probes above this needs the
          # library, and an accessibility-enabled one, so it cannot live in
          # tests/ -- wx-config does not name GTK's include paths.
          g++ -o /tmp/gtk4-a11y-wx-bridge \
              docs/gtk/probes/gtk4-a11y-wx-bridge.cpp \
              $(./wx-config --cxxflags --libs core,base) \
              $(pkg-config --cflags --libs gtk4)
          GTK_A11Y=test LD_LIBRARY_PATH=$(pwd)/lib \
              xvfb-run -a /tmp/gtk4-a11y-wx-bridge

      - name: Building tests
        working-directory: tests
        run: |
          if [ ${{ matrix.base_tests_only }} ]; then
            # failtest and the full build both need the GUI library.
            make $wxBUILD_ARGS "CXXFLAGS=$wxMAKEFILE_CXXFLAGS" "LDFLAGS=$wxMAKEFILE_LDFLAGS" test
          else
            if [ ${{ matrix.check_headers }} ]; then
              echo "Checking that all headers are self-contained..."
              make allheaders_selfcontained
              echo "Done."
            fi
            make $wxBUILD_ARGS failtest
            make -k $wxBUILD_ARGS "CXXFLAGS=$wxMAKEFILE_CXXFLAGS" "LDFLAGS=$wxMAKEFILE_LDFLAGS"
          fi

      - name: Setup tmate
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_tests }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1'
          cache: false

      - name: Testing
        working-directory: tests
        run: |
          . ../build/tools/httpbin.sh

          httpbin_launch

          if [ ${{ matrix.use_ubsan }} ]; then
            # First run wiht UBSAN: halt on first error to make sure we fail if
            # any UB is detected.
            export UBSAN_OPTIONS=halt_on_error=1
          fi

          # Explicitly use bash because /bin/sh doesn't have pipefail option
          /bin/bash -o pipefail -c './test 2>&1 | tee test.out' || rc=$?
          if [ ${{ matrix.use_asan }} ]; then
            # Work around spurious crashes by running the test again.
            # See https://github.com/google/sanitizers/issues/1353
            if grep -qF 'LeakSanitizer has encountered a fatal error' test.out; then
                echo '+++ Rerunning the tests once again after LeakSanitizer crash +++'
                unset rc
                ./test || rc=$?
            fi
          fi

          if [ ${{ matrix.use_ubsan }} ]; then
            if grep -qF ': runtime error: ' test.out; then
              export UBSAN_OPTIONS=print_stacktrace=1
              echo '+++ UB detected, rerunning the tests to show all occurrences +++'
              ./test
              # Leave rc set to non-zero value to indicate failure.
            fi
          fi

          if [ -n "$rc" ]; then
            httpbin_show_log
            exit $rc
          fi

      - name: Testing launching GUI test
        if: '!matrix.base_tests_only'
        working-directory: tests
        run: |
          WX_TEST_DISABLE_GUI=1 ./test_gui

      - name: Testing GUI using Xvfb
        if: matrix.use_xvfb && !matrix.base_tests_only
        working-directory: tests
        run: |
          if [ ${{ matrix.use_asan }} ]; then
            # Leak suppression only works if we have debug symbols available,
            # otherwise we disable it to avoid tons of reports about leaks in
            # libfontconfig etc.
            if [ -f wx_dbgsym_available ]; then
                export LSAN_OPTIONS=suppressions=$(pwd)/misc/suppressions/lsan
            else
                ASAN_OPTIONS="$ASAN_OPTIONS detect_leaks=0"
            fi

            # Running all tests at once fails, apparently due to running out of
            # memory when using ASAN, work around this problem by excluding
            # RichTextCtrlTestCase whose Table sub-test seems to be problematic.
            wx_tests_selection='~[.] ~RichTextCtrlTestCase'
          fi

          if [ ${{ matrix.use_ubsan }} ]; then
            # First run with UBSAN: halt on first error to make sure we fail if
            # any UB is detected.
            export UBSAN_OPTIONS=halt_on_error=1
          fi

          # The tests only work reliably with native windows
          export QT_USE_NATIVE_WINDOWS=1

          # Configure the system to create core files and create them in the
          # current directory instead of using apport to handle them, as
          # Ubuntu does by default (even in a container where apport is not
          # only not running but not even installed). Also turn off appending
          # PID to the core files names which is on by default.
          ulimit -c unlimited
          echo core | sudo tee /proc/sys/kernel/core_pattern
          echo 0 | sudo tee /proc/sys/kernel/core_uses_pid

          # This is exceedingly weird, but for some reason the first test using
          # wxWebView sometimes fails (even if the timeout in the test is
          # increased), so run it before really running the tests -- then they
          # will succeed.
          xvfb-run -a -s '-screen 0 1600x1200x24' ./test_gui -c Title WebView >/dev/null 2>&1 || echo 'First wxWebView test failure ignored.'

          /bin/bash -o pipefail -c "xvfb-run -a -s '-screen 0 1600x1200x24' ./test_gui -d 1 $wx_tests_selection 2>&1 | tee -a test_gui.out" || rc=$?

          if [ ${{ matrix.use_ubsan }} ]; then
            if grep -qF ': runtime error: ' test_gui.out; then
              echo "\n\n+++ UB detected, rerunning the tests to show all occurrences +++\n"
              export UBSAN_OPTIONS=print_stacktrace=1
              xvfb-run -a -s '-screen 0 1600x1200x24' ./test_gui $wx_tests_selection
              # rc should be already set to non-zero value, but make sure of it.
              rc=1
            fi
          fi

          if [ -n "$rc" ]; then
            if grep -qF '(core dumped)' test_gui.out; then
                echo '*** Test crashed, trying to get more information ***'
                gdb --quiet --core=core -ex 'where' -ex 'thread apply all bt' -ex 'q' ./test_gui
            fi
            exit $rc
          fi


      - name: Building samples
        if: matrix.skip_samples != true
        run: |
          make -k $wxBUILD_ARGS "CXXFLAGS=$wxMAKEFILE_CXXFLAGS" "LDFLAGS=$wxMAKEFILE_LDFLAGS" samples

      - name: Installing
        run: |
          sudo make install

      - name: Testing installation
        run: |
          make -C samples/minimal -f makefile.unx clean
          make -C samples/minimal -f makefile.unx $wxBUILD_ARGS "CXXFLAGS=$wxMAKEFILE_CXXFLAGS" "LDFLAGS=$wxMAKEFILE_LDFLAGS"

      - name: Building samples out of tree
        if: matrix.build_out_of_tree_samples
        run: |
          make -C samples clean
          for f in $(find samples -name makefile.unx); do
              mv $f $(dirname $f)/Makefile
          done
          make -C samples -k $wxBUILD_ARGS
